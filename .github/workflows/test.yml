name: Validate companion

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-factory:
    name: Content and executable integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: PYTHONPATH=. python -m unittest discover -s reference-factory/example -p 'test_*.py'
      - name: Run artifact-contract tests
        run: PYTHONPATH=. python -m unittest discover -s tools -p 'test_*.py'
      - name: Run reader journey
        run: ./reference-factory/run-reader-journey.sh
      - name: Validate example accountability artifacts
        run: |
          PYTHONPATH=. python tools/validate_artifact.py examples/artifacts/*.valid.json
          PYTHONPATH=. python tools/validate_artifact.py --expect-invalid examples/artifacts/*.invalid-self-approval.json
      - name: Validate published paths and local links
        run: python scripts/validate_repository.py
      - name: Build and test versioned reader bundle
        run: |
          python scripts/build_reader_bundle.py
          python -m zipfile -t dist/accountable-ai-software-factory-companion-v1.1.0.zip
