name: Validate companion

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-factory:
    name: Content and executable integrity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s reference-factory/example -p "test_*.py"
        env:
          PYTHONPATH: .
      - name: Run artifact-contract tests
        run: python -m unittest discover -s tools -p "test_*.py"
        env:
          PYTHONPATH: .
      - name: Run reader journey
        run: python reference-factory/example/run_reader_journey.py
        env:
          PYTHONPATH: .
      - name: Validate example accountability artifacts
        shell: bash
        run: |
          PYTHONPATH=. python tools/validate_artifact.py examples/artifacts/*.valid.json
          PYTHONPATH=. python tools/validate_artifact.py --expect-invalid examples/artifacts/*.invalid-self-approval.json
      - name: Validate published paths and local links
        run: python scripts/validate_repository.py
      - name: Build and test versioned reader bundle
        run: python scripts/build_reader_bundle.py

  unpack-and-run:
    name: Unpack release ZIP and run documented command
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build reader bundle
        run: python scripts/build_reader_bundle.py
      - name: Unpack and execute as a reader would
        shell: bash
        run: |
          archive="$(find dist -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$archive"
          unpacked="$RUNNER_TEMP/accountable-factory-reader"
          mkdir -p "$unpacked"
          unzip -q "$archive" -d "$unpacked"
          reader_root="$(find "$unpacked" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -x "$reader_root/reference-factory/run-reader-journey.sh"
          cd "$reader_root"
          ./reference-factory/run-reader-journey.sh
          python scripts/validate_repository.py
