name: Validate companion

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s reference-factory/example -p 'test_*.py'
      - name: Run reader journey
        run: ./reference-factory/run-reader-journey.sh
      - name: Validate published paths and local links
        run: python scripts/validate_repository.py
