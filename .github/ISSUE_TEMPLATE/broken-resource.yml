name: Report a broken companion resource
description: Report a broken link, test, template, or reader journey.
title: "Broken resource: "
labels: [broken]
body:
  - type: input
    id: resource
    attributes:
      label: Resource path or URL
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, browser, or reader, as relevant"
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked for an existing issue and removed private or sensitive information.
          required: true
